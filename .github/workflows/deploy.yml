name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/isabellanunes-dev

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            PUBLIC_ADMIN_PIN=${{ secrets.PUBLIC_ADMIN_PIN }}

      - name: Setup SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy na VPS
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker pull ghcr.io/${{ github.repository_owner }}/isabellanunes-dev:latest && \
             docker stop isabellanunes 2>/dev/null || true ; \
             docker rm   isabellanunes 2>/dev/null || true ; \
             docker run -d \
               --name isabellanunes \
               --restart unless-stopped \
               -p 127.0.0.1:3001:80 \
               ghcr.io/${{ github.repository_owner }}/isabellanunes-dev:latest"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
