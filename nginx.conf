limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = / {
        return 302 /pt/;
    }

    location /admin/ {
        limit_req zone=admin burst=3 nodelay;
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Missing pages under /en/ get the English 404; everywhere else falls back
    # to /404.html (Portuguese), below.
    location /en/ {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /en/404/index.html;
    }

    # Everything under /_astro/ (scripts, styles, and every image the build
    # optimizes) is fingerprinted: its name changes when its content does, so
    # it can be cached for good.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Files copied as-is from public/ keep their names, so a changed file has
    # to be picked up: cache for a day, not a year.
    location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;

    # Newer nginx labels .js files text/javascript rather than
    # application/javascript, so list both or the React bundle skips gzip.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
